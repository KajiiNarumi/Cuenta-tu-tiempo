<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Lista</title>

<style>

html,body{
margin:0;
padding:0;
background:#000;
color:#1296BF;
font-family:monospace;
font-size:18px;
overflow-x:hidden;
}

.container{
max-width:1100px;
margin:auto;
padding:30px 20px;
}

.mode{
text-align:center;
margin-bottom:35px;
font-size:26px;
}

.mode a{
text-decoration:none;
color:#1296BF;
opacity:.35;
}

.mode span{
opacity:.35;
}

.mode .active{
opacity:1;
font-weight:bold;
}

table{
width:100%;
border-collapse:collapse;
}

td{
padding:12px 8px;
border-bottom:1px solid #1296BF33;
vertical-align:middle;
}

.name{
width:40%;
font-size:1.1em;
}

.time{
width:140px;
text-align:center;
font-size:1.3em;
}

.controls{
text-align:right;
}

/* botones icono */

button{
background:none;
border:1px solid #1296BF;
color:#1296BF;
cursor:pointer;
margin:3px;
width:38px;
height:32px;
display:inline-flex;
align-items:center;
justify-content:center;
padding:0;
}

button svg{
width:16px;
height:16px;
stroke:#1296BF;
fill:none;
stroke-width:2;
}

button:hover{
background:#1296BF;
}

button:hover svg{
stroke:#000;
}

/* estados */

.finished{
color:#ff4040;
}

.warning{
color:#ffd000;
}

/* agregar */

.add{
margin-top:30px;
display:flex;
flex-wrap:wrap;
gap:10px;
}

input{
background:none;
border:1px solid #1296BF;
color:#1296BF;
padding:8px;
font-family:monospace;
flex:1;
min-width:120px;
}

/* móvil */

@media (max-width:700px){

.container{
padding:20px 12px;
}

.mode{
font-size:22px;
}

td{
display:block;
width:100%;
border:none;
padding:6px 0;
}

tr{
display:block;
border-bottom:1px solid #1296BF33;
padding-bottom:10px;
margin-bottom:10px;
}

.controls{
text-align:left;
}

.time{
font-size:1.2em;
margin-bottom:4px;
}

}

</style>
</head>

<body>

<div class="container">

<div class="mode">
<a href="https://kajiinarumi.github.io/Cuenta-tu-tiempo/">Simple</a>
<span> / </span>
<span class="active">LISTA</span>
</div>

<table id="table"></table>

<div class="add">
<input id="newName" placeholder="item">
<input id="newTime" placeholder="HHMM">
<button onclick="addItem()">Add</button>
</div>

</div>

<script>

let items=JSON.parse(localStorage.getItem("cookTimers")||"[]")

function save(){
localStorage.setItem("cookTimers",JSON.stringify(items))
}

function parseTime(raw){

raw=raw.replace(/\D/g,"")

let min=raw.slice(-2)
let hr=raw.slice(0,-2)

return (parseInt(hr||0)*3600)+(parseInt(min||0)*60)
}

function formatTime(sec){

let h=Math.floor(sec/3600)
let m=Math.floor((sec%3600)/60)
let s=sec%60

return String(h).padStart(2,"0")+":"+
       String(m).padStart(2,"0")+":"+
       String(s).padStart(2,"0")
}

function computeRemaining(item){

if(!item.running) return item.remaining

let elapsed=Math.floor((Date.now()-item.start)/1000)
let left=item.duration-elapsed

if(left<=0){
item.running=false
item.remaining=0
return 0
}

item.remaining=left
return left
}

function adjustTime(item,seconds,remaining){

item.remaining=Math.max(0,remaining+seconds)
item.duration=item.remaining

if(item.running){
item.start=Date.now()
}

}

function icon(svg){
let b=document.createElement("button")
b.innerHTML=svg
return b
}

function render(){

let table=document.getElementById("table")
table.innerHTML=""

items.forEach((item,i)=>{

let remaining=computeRemaining(item)

let row=document.createElement("tr")

if(remaining===0) row.classList.add("finished")
else if(remaining<=item.duration*0.2) row.classList.add("warning")

let name=document.createElement("td")
name.className="name"
name.textContent=item.name

let time=document.createElement("td")
time.className="time"
time.textContent=formatTime(remaining)

let controls=document.createElement("td")
controls.className="controls"

let minus10=icon(`<svg viewBox="0 0 24 24"><path d="M4 12h10"/></svg>`)
minus10.onclick=()=>{
adjustTime(item,-600,remaining)
save();render()
}

let minus1=icon(`<svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg>`)
minus1.onclick=()=>{
adjustTime(item,-60,remaining)
save();render()
}

let plus1=icon(`<svg viewBox="0 0 24 24"><path d="M12 5v14"/><path d="M5 12h14"/></svg>`)
plus1.onclick=()=>{
adjustTime(item,60,remaining)
save();render()
}

let plus10=icon(`<svg viewBox="0 0 24 24"><path d="M12 5v14"/><path d="M5 12h14"/><circle cx="19" cy="12" r="2"/></svg>`)
plus10.onclick=()=>{
adjustTime(item,600,remaining)
save();render()
}

let play=icon(item.running ?
`<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6z"/><path d="M14 5h4v14h-4z"/></svg>`
:
`<svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg>`
)

play.onclick=()=>{

if(item.running){
item.running=false
item.remaining=remaining
}else{
item.running=true
item.start=Date.now()-(item.duration-remaining)*1000
}

save();render()

}

let del=icon(`<svg viewBox="0 0 24 24">
<path d="M4 7h16"/>
<path d="M9 7v12"/>
<path d="M15 7v12"/>
<path d="M6 7l1-3h10l1 3"/>
</svg>`)

del.onclick=()=>{
items.splice(i,1)
save();render()
}

controls.append(minus10,minus1,plus1,plus10,play,del)

row.append(name,time,controls)

table.appendChild(row)

})

}

function addItem(){

let name=document.getElementById("newName").value.trim()
let time=document.getElementById("newTime").value.trim()

if(!name||!time) return

let duration=parseTime(time)

items.push({
name:name,
duration:duration,
remaining:duration,
running:false,
start:0
})

document.getElementById("newName").value=""
document.getElementById("newTime").value=""

save()
render()

}

setInterval(render,1000)

render()

</script>

</body>
</html>
